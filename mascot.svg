<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Blasty">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56a"/>
      <stop offset="100%" stop-color="#f6b23e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- left arm -->
  <ellipse cx="18" cy="78" rx="10" ry="14" fill="#e89a1a" transform="rotate(-25 18 78)"/>
  <!-- right arm -->
  <ellipse cx="110" cy="78" rx="10" ry="14" fill="#e89a1a" transform="rotate(25 110 78)"/>
  <!-- body -->
  <rect x="22" y="30" width="84" height="84" rx="20" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="22" y="30" width="84" height="42" rx="20" fill="url(#shine)"/>
  <!-- face -->
  <ellipse class="mascot-eye" cx="50" cy="68" rx="9" ry="11" fill="#1a1200"/>
  <ellipse class="mascot-eye" cx="78" cy="68" rx="9" ry="11" fill="#1a1200"/>
  <circle cx="53" cy="64" r="3.5" fill="#fff"/>
  <circle cx="81" cy="64" r="3.5" fill="#fff"/>
  <path class="mascot-mouth" d="M46 84 Q64 98 82 84" stroke="#1a1200" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- cheek blush -->
  <ellipse cx="38" cy="80" rx="7" ry="4" fill="#ef4b5f" opacity=".25"/>
  <ellipse cx="90" cy="80" rx="7" ry="4" fill="#ef4b5f" opacity=".25"/>
  <!-- spark -->
  <g fill="#fff" opacity=".9">
    <polygon points="98,24 100,30 106,30 101,34 103,40 98,36 93,40 95,34 90,30 96,30"/>
  </g>
</svg>
