<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Blasty pensando">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56a"/>
      <stop offset="100%" stop-color="#f6b23e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <ellipse cx="20" cy="82" rx="10" ry="14" fill="#e89a1a" transform="rotate(-18 20 82)"/>
  <!-- right arm up to "chin" (thinking pose) -->
  <ellipse cx="98" cy="96" rx="9" ry="13" fill="#e89a1a" transform="rotate(70 98 96)"/>
  <rect x="22" y="30" width="84" height="84" rx="20" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="22" y="30" width="84" height="42" rx="20" fill="url(#shine)"/>
  <!-- eyes looking up (pupils high) -->
  <ellipse class="mascot-eye" cx="50" cy="68" rx="9" ry="11" fill="#1a1200"/>
  <ellipse class="mascot-eye" cx="78" cy="68" rx="9" ry="11" fill="#1a1200"/>
  <circle cx="51" cy="61" r="3.5" fill="#fff"/>
  <circle cx="79" cy="61" r="3.5" fill="#fff"/>
  <!-- raised brow -->
  <path d="M42 55 Q50 52 58 55" stroke="#c98a00" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- small pursed mouth to the side -->
  <path d="M54 88 Q62 85 70 89" stroke="#1a1200" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="38" cy="82" rx="7" ry="4" fill="#ef4b5f" opacity=".22"/>
  <!-- thought dots -->
  <g fill="#fff" opacity=".85">
    <circle cx="112" cy="34" r="3"/>
    <circle cx="120" cy="26" r="2"/>
  </g>
</svg>
