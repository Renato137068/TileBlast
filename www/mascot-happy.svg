<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Blasty feliz">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56a"/>
      <stop offset="100%" stop-color="#f6b23e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <ellipse cx="18" cy="76" rx="10" ry="14" fill="#e89a1a" transform="rotate(-35 18 76)"/>
  <ellipse cx="110" cy="76" rx="10" ry="14" fill="#e89a1a" transform="rotate(35 110 76)"/>
  <rect x="22" y="30" width="84" height="84" rx="20" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="22" y="30" width="84" height="42" rx="20" fill="url(#shine)"/>
  <!-- happy squinting eyes (curved up) -->
  <path d="M42 68 Q50 58 58 68" stroke="#1a1200" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M70 68 Q78 58 86 68" stroke="#1a1200" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- big open smile -->
  <path d="M44 82 Q64 104 84 82 Z" fill="#1a1200"/>
  <path d="M52 92 Q64 100 76 92" fill="#ef4b5f"/>
  <ellipse cx="36" cy="82" rx="8" ry="5" fill="#ef4b5f" opacity=".32"/>
  <ellipse cx="92" cy="82" rx="8" ry="5" fill="#ef4b5f" opacity=".32"/>
  <g fill="#fff" opacity=".9">
    <polygon points="98,22 100,28 106,28 101,32 103,38 98,34 93,38 95,32 90,28 96,28"/>
  </g>
</svg>
