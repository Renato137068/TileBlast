<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Blasty triste">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56a"/>
      <stop offset="100%" stop-color="#f6b23e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <ellipse cx="20" cy="88" rx="10" ry="14" fill="#e89a1a" transform="rotate(-8 20 88)"/>
  <ellipse cx="108" cy="88" rx="10" ry="14" fill="#e89a1a" transform="rotate(8 108 88)"/>
  <rect x="22" y="30" width="84" height="84" rx="20" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="22" y="30" width="84" height="42" rx="20" fill="url(#shine)"/>
  <!-- droopy eyes (eyelids covering top) -->
  <ellipse class="mascot-eye" cx="50" cy="70" rx="9" ry="11" fill="#1a1200"/>
  <ellipse class="mascot-eye" cx="78" cy="70" rx="9" ry="11" fill="#1a1200"/>
  <circle cx="52" cy="72" r="3" fill="#fff"/>
  <circle cx="80" cy="72" r="3" fill="#fff"/>
  <!-- sad slanted brows/lids -->
  <path d="M41 60 Q50 64 58 62" stroke="#c98a00" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M70 62 Q78 64 87 60" stroke="#c98a00" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- frown -->
  <path d="M48 92 Q64 80 80 92" stroke="#1a1200" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- teardrop -->
  <path d="M44 78 q-4 6 0 9 q4 -3 0 -9 Z" fill="#7fd0ff" opacity=".9"/>
</svg>
