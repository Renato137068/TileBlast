<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Blasty animado">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56a"/>
      <stop offset="100%" stop-color="#f6b23e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <ellipse cx="16" cy="70" rx="10" ry="14" fill="#e89a1a" transform="rotate(-55 16 70)"/>
  <ellipse cx="112" cy="70" rx="10" ry="14" fill="#e89a1a" transform="rotate(55 112 70)"/>
  <rect x="22" y="30" width="84" height="84" rx="20" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="22" y="30" width="84" height="42" rx="20" fill="url(#shine)"/>
  <!-- wide sparkly eyes -->
  <ellipse cx="50" cy="66" rx="10" ry="12" fill="#1a1200"/>
  <ellipse cx="78" cy="66" rx="10" ry="12" fill="#1a1200"/>
  <circle cx="53" cy="61" r="4.5" fill="#fff"/>
  <circle cx="81" cy="61" r="4.5" fill="#fff"/>
  <circle cx="47" cy="70" r="2" fill="#fff" opacity=".8"/>
  <circle cx="75" cy="70" r="2" fill="#fff" opacity=".8"/>
  <!-- open grin (excited) -->
  <path d="M46 82 Q64 106 82 82 Q64 96 46 82 Z" fill="#1a1200"/>
  <ellipse cx="64" cy="90" rx="9" ry="5" fill="#ef4b5f"/>
  <ellipse cx="36" cy="80" rx="8" ry="5" fill="#ef4b5f" opacity=".4"/>
  <ellipse cx="92" cy="80" rx="8" ry="5" fill="#ef4b5f" opacity=".4"/>
  <!-- extra sparks -->
  <g fill="#fff">
    <polygon points="98,20 100,26 106,26 101,30 103,36 98,32 93,36 95,30 90,26 96,26"/>
    <polygon points="24,18 25.5,22 30,22 26,25 27.5,29 24,26.5 20.5,29 22,25 18,22 22.5,22" opacity=".85"/>
  </g>
</svg>
